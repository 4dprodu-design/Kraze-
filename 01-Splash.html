<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAF7">
  <meta name="author" content="Erian C.A.">
  <meta name="color-scheme" content="only light">
  <title>Kraze</title>

  <!-- ============================================================
       KRAZE · Splash
       © 2026 Erian C.A. — Todos los derechos reservados
       Archivo: 01-Splash.html
       Sin animaciones. Con timeout de seguridad.
       ============================================================ -->
  <style>
    :root { color-scheme: only light; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: #FAFAF7;
      -webkit-tap-highlight-color: transparent;
      animation: none !important;
      transition: none !important;
      forced-color-adjust: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .splash-logo {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo svg {
      display: block;
      height: 100%;
      width: auto;
    }

    .splash-copy {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      color: #B0B5A8;
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>

  <div class="splash-logo">
    <svg viewBox="0 0 360 96" xmlns="http://www.w3.org/2000/svg" aria-label="Kraze">
      <g transform="translate(0, 4)">
        <path
          d="M 36 0 C 16 0 0 16 0 36 C 0 52 10 64 24 76 L 36 88 L 48 76 C 62 64 72 52 72 36 C 72 16 56 0 36 0 Z"
          fill="#A4D65E"
        />
        <path
          d="M 36 22 C 36 22 30 15 23 15 C 16 15 11 20 11 27 C 11 33 15 38 21 44 L 36 60 L 51 44 C 57 38 61 33 61 27 C 61 20 56 15 49 15 C 42 15 36 22 36 22 Z"
          fill="#1A1F2E"
        />
      </g>
      <text
        x="94" y="70"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="62"
        font-weight="900"
        letter-spacing="-2.5"
        fill="#1A1F2E"
      >Kraze</text>
    </svg>
  </div>

  <div class="splash-copy">
    © 2026 Erian C.A.
  </div>

  <!-- ============================================================
       Scripts base
       nav.js está en la RAÍZ del proyecto (no en js/)
       ============================================================ -->
  <script src="nav.js"></script>

  <!-- ============================================================
       Lógica del Splash
       CON TIMEOUT DE SEGURIDAD:
       Si nav.js no carga o falla, este código igual redirige.
       ============================================================ -->
  <script>
  (function () {
    'use strict';

    var DURACION_MS = 1500;
    var RUTA_LOGIN  = '02-Login.html';
    var RUTA_HOME_P = '04-Home-Pasajero.html';
    var RUTA_HOME_T = '04-Home-Transportista.html';

    /* --- Bloquear botón atrás --- */
    try {
      window.history.pushState(null, '', window.location.href);
      window.addEventListener('popstate', function () {
        window.history.pushState(null, '', window.location.href);
      });
    } catch (e) { /* ignorar */ }

    /* --- Leer rol desde localStorage con protección --- */
    function leerRol() {
      try {
        return localStorage.getItem('kraze_rol') || null;
      } catch (e) {
        return null;
      }
    }

    /* --- Decidir destino con protección total --- */
    function decidirDestino() {
      try {
        // Si Kraze.nav existe y tiene config, usarlo
        if (window.Kraze && window.Kraze.nav && window.Kraze.nav.config) {
          var rol = window.Kraze.nav.getRol();
          if (rol === 'pasajero')      return window.Kraze.nav.config.homePasajero;
          if (rol === 'transportista') return window.Kraze.nav.config.homeTransportista;
          return window.Kraze.nav.config.login;
        }
      } catch (e) { /* ignorar y caer al fallback */ }

      // FALLBACK: si nav.js no cargó, decidir manualmente
      var rol = leerRol();
      if (rol === 'pasajero')      return RUTA_HOME_P;
      if (rol === 'transportista') return RUTA_HOME_T;
      return RUTA_LOGIN;
    }

    /* --- Redirigir con protección total --- */
    function redirigir() {
      var destino;
      try {
        destino = decidirDestino();
      } catch (e) {
        destino = RUTA_LOGIN;
      }

      try {
        window.location.replace(destino);
      } catch (e) {
        // Último recurso
        window.location.href = RUTA_LOGIN;
      }
    }

    /* --- Timeout principal --- */
    setTimeout(redirigir, DURACION_MS);

    /* --- Timeout de seguridad: si a los 4s aún estamos aquí, forzar login --- */
    setTimeout(function () {
      try {
        // Si la URL no ha cambiado, todavía estamos en el splash
        if (window.location.pathname.indexOf('01-Splash') !== -1 ||
            window.location.pathname.indexOf('Splash') !== -1) {
          window.location.replace(RUTA_LOGIN);
        }
      } catch (e) {
        window.location.href = RUTA_LOGIN;
      }
    }, 4000);

  })();
  </script>

</body>
</html>
