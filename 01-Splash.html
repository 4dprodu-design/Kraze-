  <style>
    /* --- Reset total --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: #FAFAF7;
      -webkit-tap-highlight-color: transparent;
      animation: none !important;
      transition: none !important;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* --- Logo centrado, sin animación --- */
    .splash-logo {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo svg {
      display: block;
      height: 100%;
      width: auto;
    }

    /* --- Copyright --- */
    .splash-copy {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      color: #B0B5A8;
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>

  <div class="splash-logo">
    <svg viewBox="0 0 360 96" xmlns="http://www.w3.org/2000/svg" aria-label="Kraze">

        />
      </g>
      <text
        x="94" y="70"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="62"
        font-weight="900"
        letter-spacing="-2.5"

  <div class="splash-copy">
    © 2026 Erian C.A.

  <!-- ============================================================
       Scripts base
       ============================================================ -->
  <script src="js/nav.js"></script>

  <!-- ============================================================
       Lógica del Splash
       NO carga theme.js (evita que cambie colores y parpadee)
       ============================================================ -->
  <script>
  (function () {
    'use strict';

    const DURACION_MS = 1500;

    /* --- Bloquear botón atrás --- */
    window.history.pushState(null, '', window.location.href);
    window.addEventListener('popstate', function () {
      window.history.pushState(null, '', window.location.href);
    });

    /* --- Decidir destino --- */
    function decidirDestino() {
      const rol = Kraze.nav.getRol();
      if (rol === 'pasajero')      return Kraze.nav.config.homePasajero;
      if (rol === 'transportista') return Kraze.nav.config.homeTransportista;
      return Kraze.nav.config.login;
    }

    /* --- Redirigir sin transición --- */
    setTimeout(function () {
      const destino = decidirDestino();
      window.location.replace(destino);
    }, DURACION_MS);

  })();
  </script>

</body>
