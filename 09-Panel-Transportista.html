<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FAFAF7">
<title>Panel transportista · Kraze</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: #FAFAF7;
  color: #1A1F2E;
  overflow-x: hidden;
}
body { padding-bottom: 110px; }

/* HEADER */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 10px;
  background: #FAFAF7;
  position: sticky; top: 0; z-index: 50;
}
.back-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: #FFFFFF; border: 1px solid #F0F0EB;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #1A1F2E;
}
.back-btn svg { width: 20px; height: 20px; pointer-events: none; }
.top-title { font-size: 18px; font-weight: 800; color: #1A1F2E; letter-spacing: -0.3px; }

/* SWITCH ONLINE */
.online-switch {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px 8px 8px;
  background: #FFFFFF;
  border: 1px solid #F0F0EB;
  border-radius: 30px;
  cursor: pointer;
  font-family: inherit;
}
.online-dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: #B0B4BF;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.online-dot svg { width: 16px; height: 16px; color: #FFFFFF; }
.online-switch.on .online-dot { background: #22C55E; }
.online-switch.on { border-color: #22C55E; }
.online-texto {
  font-size: 12px;
  font-weight: 700;
  color: #8A8F9C;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.online-switch.on .online-texto { color: #22C55E; }

/* HERO GANANCIAS */
.hero {
  margin: 0 20px 16px;
  background: linear-gradient(135deg, #1A1F2E 0%, #2A3142 100%);
  border-radius: 20px;
  padding: 22px;
  color: #FFFFFF;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; right: -50px; top: -50px;
  width: 160px; height: 160px;
  border-radius: 50%;
  background: rgba(164,214,94,0.15);
}
.hero-label {
  font-size: 11px; font-weight: 700; color: #A4D65E;
  letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 6px; position: relative; z-index: 1;
}
.hero-monto {
  font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1;
  position: relative; z-index: 1;
}
.hero-monto small { font-size: 15px; font-weight: 600; color: #A4D65E; margin-left: 6px; }
.hero-sub {
  font-size: 12px; color: #B0B4BF; margin-top: 8px;
  position: relative; z-index: 1;
}
.hero-btn {
  position: absolute; right: 20px; top: 50%;
  transform: translateY(-50%);
  background: #A4D65E; color: #1A1F2E;
  border: none; padding: 10px 16px; border-radius: 12px;
  font-size: 12px; font-weight: 800; font-family: inherit;
  cursor: pointer; z-index: 2;
}

/* STATS RÁPIDAS */
.stats-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 10px; margin: 0 20px 20px;
}
.stat-card {
  background: #FFFFFF; border: 1px solid #F0F0EB;
  border-radius: 16px; padding: 14px 10px; text-align: center;
}
.stat-value {
  font-size: 20px; font-weight: 800; color: #1A1F2E;
  letter-spacing: -0.5px; line-height: 1;
}
.stat-label {
  font-size: 10px; font-weight: 700; color: #8A8F9C;
  letter-spacing: 0.5px; text-transform: uppercase; margin-top: 6px;
}

/* SOLICITUDES */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px 12px;
}
.section-title { font-size: 16px; font-weight: 800; color: #1A1F2E; letter-spacing: -0.3px; }
.section-count {
  font-size: 12px; font-weight: 700; color: #8A8F9C;
  background: #F0F0EB; padding: 4px 10px; border-radius: 12px;
}

/* CARD SOLICITUD */
.request-card {
  margin: 0 20px 12px; background: #FFFFFF;
  border-radius: 18px; border: 1px solid #F0F0EB; padding: 18px;
}
.req-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 14px;
}
.req-tipo {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: rgba(164,214,94,0.15); color: #1A1F2E;
  border-radius: 20px; font-size: 12px; font-weight: 800;
  letter-spacing: 0.3px; text-transform: uppercase;
}
.req-tipo svg { width: 14px; height: 14px; }
.req-precio {
  font-size: 22px; font-weight: 800; color: #1A1F2E; letter-spacing: -0.5px;
}
.req-precio small { font-size: 12px; color: #8A8F9C; font-weight: 600; margin-left: 2px; }

.req-ruta { display: flex; gap: 12px; padding: 12px 0; }
.ruta-linea {
  display: flex; flex-direction: column; align-items: center; padding-top: 6px;
}
.ruta-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.ruta-dot.green { background: #22C55E; }
.ruta-dot.dark { background: #1A1F2E; }
.ruta-barra { flex: 1; width: 2px; background: #F0F0EB; margin: 4px 0; min-height: 16px; }
.ruta-textos { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.ruta-punto { font-size: 13px; color: #1A1F2E; font-weight: 600; line-height: 1.3; }

.req-meta {
  display: flex; gap: 14px; padding: 10px 0 14px;
  border-top: 1px solid #FAFAF7; font-size: 12px;
  color: #8A8F9C; font-weight: 600;
}
.req-meta span { display: inline-flex; align-items: center; gap: 4px; }
.req-meta svg { width: 13px; height: 13px; }

.req-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.btn-reject {
  padding: 14px; background: #FAFAF7; color: #8A8F9C;
  border: 1px solid #F0F0EB; border-radius: 14px;
  font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
}
.btn-reject:active { background: #F0F0EB; }
.btn-accept {
  padding: 14px; background: #1A1F2E; color: #FFFFFF;
  border: none; border-radius: 14px;
  font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
}
.btn-accept:active { background: #000000; }

/* ESTADO VACÍO */
.empty-box {
  margin: 0 20px 20px; background: #FFFFFF;
  border-radius: 20px; border: 1px solid #F0F0EB;
  padding: 40px 20px; text-align: center;
}
.empty-icon { width: 64px; height: 64px; margin: 0 auto 14px; color: #D1D5DB; }
.empty-title { font-size: 15px; font-weight: 700; color: #1A1F2E; margin-bottom: 4px; }
.empty-sub {
  font-size: 13px; color: #8A8F9C; line-height: 1.5;
  max-width: 260px; margin: 0 auto;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #FFFFFF; border-top: 1px solid #F0F0EB;
  display: flex; justify-content: space-around;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0));
  z-index: 100;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 4px; text-decoration: none; color: #8A8F9C;
  border: none; background: transparent; cursor: pointer; font-family: inherit;
}
.nav-item.active { color: #1A1F2E; }
.nav-item svg { width: 22px; height: 22px; }
.nav-item span { font-size: 10px; font-weight: 600; }
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════
   PANEL TRANSPORTISTA · LÓGICA
   ═══════════════════════════════════════════════════════════ */
(function () {
  var online = false;
  try { online = localStorage.getItem('kraze_transportista_online') === '1'; } catch (e) {}
  aplicarEstadoOnline();

  window.toggleOnline = function () {
    online = !online;
    try { localStorage.setItem('kraze_transportista_online', online ? '1' : '0'); } catch (e) {}
    aplicarEstadoOnline();
  };

  function aplicarEstadoOnline() {
    var sw = document.getElementById('onlineSwitch');
    var txt = document.getElementById('onlineTexto');
    var emptySub = document.getElementById('emptySub');
    if (online) {
      sw.classList.add('on');
      txt.textContent = 'Online';
      if (emptySub) emptySub.textContent = 'Buscando viajes cerca de ti...';
    } else {
      sw.classList.remove('on');
      txt.textContent = 'Offline';
      if (emptySub) emptySub.textContent = 'Ponte en línea para recibir viajes cerca de ti.';
    }
  }

  var perfil = null;
  try {
    var raw = localStorage.getItem('kraze_transportista') || localStorage.getItem('kraze_user');
    if (raw) perfil = JSON.parse(raw);
  } catch (e) {}

  if (perfil) {
    if (typeof perfil.gananciaHoy === 'number') {
      document.getElementById('heroMonto').innerHTML = '$' + perfil.gananciaHoy.toFixed(2) + '<small>USD</small>';
    }
    if (typeof perfil.viajesHoy === 'number') {
      document.getElementById('statViajes').textContent = perfil.viajesHoy;
      if (perfil.viajesHoy > 0) {
        document.getElementById('heroSub').textContent =
          perfil.viajesHoy + (perfil.viajesHoy === 1 ? ' viaje completado' : ' viajes completados');
      }
    }
    if (typeof perfil.rating === 'number') document.getElementById('statRating').textContent = perfil.rating.toFixed(1);
    if (typeof perfil.aceptacion === 'number') document.getElementById('statAceptacion').textContent = perfil.aceptacion + '%';
  }

  var solicitudes = [];
  try {
    var s = localStorage.getItem('kraze_solicitudes');
    if (s) solicitudes = JSON.parse(s) || [];
  } catch (e) {}

  var reqCount = document.getElementById('reqCount');
  var contenedor = document.getElementById('solicitudesContainer');

  if (solicitudes.length > 0) {
    reqCount.textContent = solicitudes.length;
    contenedor.innerHTML = '';
    solicitudes.forEach(function (sol, idx) {
      contenedor.appendChild(crearTarjetaSolicitud(sol, idx));
    });
  } else {
    reqCount.textContent = '0';
  }

  function crearTarjetaSolicitud(sol, idx) {
    var card = document.createElement('div');
    card.className = 'request-card';
    var tipoIcono = '<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6h-3l-3 8"/>';
    if (sol.tipo === 'carro') tipoIcono = '<path d="M5 17h14M5 17a2 2 0 11-4 0 2 2 0 014 0zm18 0a2 2 0 11-4 0 2 2 0 014 0z"/><path d="M3 17V7a2 2 0 012-2h9l3 5h4a2 2 0 012 2v5"/>';
    else if (sol.tipo === 'camion') tipoIcono = '<path d="M1 16V6h12v10M13 16V9h5l4 4v3"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>';
    var precioTxt = (typeof sol.precio === 'number') ? '$' + sol.precio.toFixed(2) : '$—';
    var distTxt = sol.distancia ? sol.distancia + ' km' : '— km';
    var tiempoTxt = sol.tiempo ? sol.tiempo + ' min' : '— min';

    card.innerHTML =
      '<div class="req-top">' +
        '<div class="req-tipo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + tipoIcono + '</svg>' + (sol.tipo || 'viaje') + '</div>' +
        '<div class="req-precio">' + precioTxt + '<small>USD</small></div>' +
      '</div>' +
      '<div class="req-ruta">' +
        '<div class="ruta-linea"><div class="ruta-dot green"></div><div class="ruta-barra"></div><div class="ruta-dot dark"></div></div>' +
        '<div class="ruta-textos"><div class="ruta-punto">' + (sol.origen || '—') + '</div><div class="ruta-punto dest">' + (sol.destino || '—') + '</div></div>' +
      '</div>' +
      '<div class="req-meta">' +
        '<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>' + distTxt + '</span>' +
        '<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' + tiempoTxt + '</span>' +
      '</div>' +
      '<div class="req-actions">' +
        '<button class="btn-reject" type="button">Rechazar</button>' +
        '<button class="btn-accept" type="button">Aceptar viaje</button>' +
      '</div>';

    card.querySelector('.btn-reject').onclick = function () { rechazar(idx); };
    card.querySelector('.btn-accept').onclick = function () { aceptar(idx); };
    return card;
  }

  function aceptar(idx) {
    var sol = solicitudes[idx];
    if (!sol) return;
    try {
      localStorage.setItem('kraze_viaje_actual', JSON.stringify({
        origen: sol.origen, destino: sol.destino, vehiculo: sol.tipo,
        distancia: sol.distancia, tiempoMin: sol.tiempo,
        total: sol.precio, estado: 'en_camino'
      }));
    } catch (e) {}
    location.href = '06-Ubicacion-Tiempo-Real.html';
  }

  function rechazar(idx) {
    solicitudes.splice(idx, 1);
    try { localStorage.setItem('kraze_solicitudes', JSON.stringify(solicitudes)); } catch (e) {}
    location.reload();
  }

  console.log('[Panel Transportista] listo. Online:', online);
})();

/* ═══════════════════════════════════════════════════════════
   ERI · LÓGICA (con voz)
   ═══════════════════════════════════════════════════════════ */
(function () {
  var API = 'https://moto-llave-backend.vercel.app/api/claude';
  var chat = document.getElementById('eriChat');
  var input = document.getElementById('eriInput');
  var sendBtn = document.getElementById('eriSend');
  var micBtn = document.getElementById('eriMic');
  var escribiendo = false;
  var grabando = false;
  var rec = null;

  function agregarMsg(tipo, texto) {
    var m = document.createElement('div');
    m.style.cssText = 'max-width:82%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.45;word-wrap:break-word;';
    if (tipo === 'user') {
      m.style.background = '#1A1F2E';
      m.style.color = '#FFFFFF';
      m.style.borderBottomRightRadius = '6px';
      m.style.alignSelf = 'flex-end';
    } else {
      m.style.background = '#FFFFFF';
      m.style.color = '#1A1F2E';
      m.style.border = '1px solid #F0F0EB';
      m.style.borderBottomLeftRadius = '6px';
      m.style.alignSelf = 'flex-start';
    }
    m.textContent = texto;
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
  }

  function enviar() {
    var texto = input.value.trim();
    if (!texto || escribiendo) return;
    agregarMsg('user', texto);
    input.value = '';
    escribiendo = true;
    sendBtn.disabled = true;

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto: texto })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var resp = d && (d.respuesta || d.mensaje);
      if (resp) { agregarMsg('eri', resp); hablar(resp); }
      else { agregarMsg('eri', 'Ups, no entendí.'); }
    })
    .catch(function () { agregarMsg('eri', 'Ups, error de conexión.'); })
    .then(function () { escribiendo = false; sendBtn.disabled = false; });
  }

  sendBtn.onclick = enviar;

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
  });

  function iniciarVoz() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Tu navegador no soporta reconocimiento de voz.'); return; }
    if (grabando) { try { rec.stop(); } catch (e) {} return; }

    rec = new SR();
    rec.lang = 'es-VE';
    rec.continuous = false;
    rec.interimResults = true;

    rec.onstart = function () {
      grabando = true;
      micBtn.style.background = '#E5484D';
      micBtn.style.color = '#FFFFFF';
    };
    rec.onresult = function (e) {
      var t = '';
      for (var i = e.resultIndex; i < e.results.length; i++) { t += e.results[i][0].transcript; }
      input.value = t;
    };
    rec.onerror = function (e) {
      grabando = false;
      micBtn.style.background = '#F4F4F0';
      micBtn.style.color = '#1A1F2E';
    };
    rec.onend = function () {
      grabando = false;
      micBtn.style.background = '#F4F4F0';
      micBtn.style.color = '#1A1F2E';
      if (input.value.trim()) setTimeout(enviar, 300);
    };

    try { rec.start(); } catch (e) {}
  }

  micBtn.onclick = iniciarVoz;

  function hablar(texto) {
    if (!window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(texto);
      u.lang = 'es-VE';
      u.rate = 1.0;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  console.log('[Eri] listo con voz');
})();
</script>
</body>
</html>
