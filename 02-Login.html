<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="only light">
<meta name="theme-color" content="#A4D65E">
<title>Kraze · Iniciar sesión</title>
<style>
:root {
  color-scheme: only light;
  --verde: #A4D65E;
  --verde-osc: #8BC34A;
  --verde-cla: #EEF7DC;
  --tinta: #1A1F2E;
  --tinta-2: #3A4256;
  --gris: #7A8194;
  --gris-cla: #E8EAEE;
  --fondo: #FAFAF7;
  --blanco: #FFFFFF;
  --rojo: #E5484D;
  --radio: 14px;
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; forced-color-adjust: none; }
html { background: var(--fondo); -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--fondo); color: var(--tinta);
  min-height: 100dvh; line-height: 1.4;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; font-size: 16px; }
.k-header { padding: 40px 24px 20px; text-align: center; }
.k-logo { width: 80px; height: 80px; margin: 0 auto 16px; display: block; }
.k-titulo { font-size: 26px; font-weight: 800; color: var(--tinta); margin: 0 0 6px; letter-spacing: -.4px; }
.k-sub { font-size: 14px; color: var(--gris); margin: 0; }
.k-main { padding: 0 24px 40px; max-width: 440px; margin: 0 auto; }
.k-btn {
  width: 100%;
  padding: 15px 18px;
  border-radius: var(--radio);
  font-size: 15px;
  font-weight: 700;
  transition: transform .12s, opacity .12s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
}
.k-btn:active { transform: scale(.97); }
.k-btn:disabled { opacity: .55; cursor: not-allowed; }
.k-btn-primario { background: var(--verde); color: var(--tinta); box-shadow: 0 4px 14px rgba(164,214,94,.4); }
.k-btn-google { background: var(--blanco); color: var(--tinta); border: 1.5px solid var(--gris-cla); box-shadow: 0 2px 6px rgba(26,31,46,.04); }
.k-btn-google svg { width: 20px; height: 20px; flex: 0 0 auto; }
.k-divider { display: flex; align-items: center; gap: 12px; margin: 22px 0; color: var(--gris); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.k-divider::before, .k-divider::after { content: ""; flex: 1; height: 1px; background: var(--gris-cla); }
.k-campo { margin-bottom: 16px; }
.k-label { display: block; font-size: 13px; font-weight: 700; color: var(--tinta-2); margin-bottom: 7px; }
.k-input { width: 100%; padding: 14px; border: 1.5px solid var(--gris-cla); border-radius: var(--radio); background: var(--blanco); color: var(--tinta); font-size: 16px; outline: none; }
.k-input:focus { border-color: var(--verde); box-shadow: 0 0 0 3px rgba(164,214,94,.22); }
.k-tabs { display: flex; gap: 6px; background: var(--gris-cla); padding: 4px; border-radius: var(--radio); margin-bottom: 20px; }
.k-tab { flex: 1; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--gris); transition: all .15s; }
.k-tab.activo { background: var(--blanco); color: var(--tinta); box-shadow: 0 2px 6px rgba(26,31,46,.06); }
.k-error { display: none; background: #FFEFEF; color: var(--rojo); padding: 12px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; margin-bottom: 16px; border: 1.5px solid rgba(229,72,77,.2); word-break: break-word; }
.k-error.visible { display: block; }
.k-spin { width: 16px; height: 16px; border: 2.5px solid rgba(26,31,46,.2); border-top-color: var(--tinta); border-radius: 50%; display: inline-block; animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.k-links { text-align: center; margin-top: 22px; font-size: 14px; }
.k-link { color: var(--verde-osc); font-weight: 600; text-decoration: none; display: inline-block; padding: 6px 4px; }
.k-link-2 { color: var(--gris); font-weight: 500; text-decoration: none; display: block; margin-top: 12px; font-size: 13px; }
.k-overlay { position: fixed; inset: 0; background: rgba(26,31,46,.6); display: none; align-items: center; justify-content: center; z-index: 999; backdrop-filter: blur(3px); }
.k-overlay.visible { display: flex; }
.k-overlay-box { background: var(--blanco); padding: 28px 32px; border-radius: var(--radio); text-align: center; max-width: 280px; }
.k-overlay-box .k-spin { width: 32px; height: 32px; border-width: 3px; margin-bottom: 14px; }
.k-overlay-box p { margin: 0; font-size: 14px; color: var(--tinta-2); font-weight: 500; }
</style>
</head>
<body>

<header class="k-header">
  <img class="k-logo" src="Img/logo.png" alt="Kraze" onerror="this.style.display='none'">
  <h1 class="k-titulo">Bienvenido a Kraze</h1>
  <p class="k-sub">Transporte total, tu ciudad en movimiento</p>
</header>

<main class="k-main">

  <button type="button" class="k-btn k-btn-google" id="kBtnGoogle">
    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35.5 24 35.5c-6.4 0-11.5-5.1-11.5-11.5S17.6 12.5 24 12.5c2.9 0 5.6 1.1 7.6 2.9l5.7-5.7C33.7 6.4 29.1 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.3-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.5 19 12.5 24 12.5c2.9 0 5.6 1.1 7.6 2.9l5.7-5.7C33.7 6.4 29.1 4.5 24 4.5 16.3 4.5 9.7 8.9 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 43.5c5 0 9.6-1.9 13-5l-6-5.1c-2 1.5-4.5 2.4-7 2.4-5.2 0-9.6-3.4-11.3-8.1l-6.5 5C9.6 39 16.3 43.5 24 43.5z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.5l6 5.1c-.4.4 6.5-4.7 6.5-14.6 0-1.2-.1-2.3-.4-3.5z"/>
    </svg>
    Continuar con Google
  </button>

  <div class="k-divider">o con tu cuenta Kraze</div>

  <div class="k-error" id="kError"></div>

  <div class="k-tabs">
    <button type="button" class="k-tab activo" data-tab="email">Correo</button>
    <button type="button" class="k-tab" data-tab="telefono">Teléfono</button>
  </div>

  <div id="kFormEmail">
    <div class="k-campo">
      <label class="k-label" for="kEmail">Correo electrónico</label>
      <input class="k-input" id="kEmail" type="email" placeholder="tu@correo.com" inputmode="email" maxlength="120" autocomplete="email">
    </div>
    <div class="k-campo">
      <label class="k-label" for="kPassEmail">Contraseña</label>
      <input class="k-input" id="kPassEmail" type="password" placeholder="Tu contraseña" maxlength="60" autocomplete="current-password">
    </div>
    <button type="button" class="k-btn k-btn-primario" id="kBtnEmail">Iniciar sesión</button>
  </div>

  <div id="kFormTel" style="display:none;">
    <div class="k-campo">
      <label class="k-label" for="kTel">Teléfono</label>
      <input class="k-input" id="kTel" type="tel" placeholder="+58 4121234567" inputmode="tel" maxlength="20" autocomplete="tel">
    </div>
    <div class="k-campo">
      <label class="k-label" for="kPassTel">Contraseña</label>
      <input class="k-input" id="kPassTel" type="password" placeholder="Tu contraseña" maxlength="60" autocomplete="current-password">
    </div>
    <button type="button" class="k-btn k-btn-primario" id="kBtnTel">Iniciar sesión</button>
  </div>

  <div class="k-links">
    <a href="02a-Recuperar-Password.html" class="k-link">¿Olvidaste tu contraseña?</a>
    <a href="03-Seleccion-Rol.html" class="k-link-2">¿No tienes cuenta? <b style="color:var(--verde-osc)">Crear cuenta</b></a>
  </div>

</main>

<div class="k-overlay" id="kOverlay">
  <div class="k-overlay-box">
    <div class="k-spin"></div>
    <p id="kOverlayTxt">Iniciando sesión...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
/* KRAZE · Login con Google + Email + Teléfono · © 2026 Erian C.A. */
(function () {
  "use strict";

  const KRAZE_SUPABASE_URL = "https://xetqvxuiroalddfzrfzc.supabase.co";
  const KRAZE_SUPABASE_KEY = "sb_publishable_SARKcARFpIESQRUDSxbpig_kdlHrZh3";

  const $ = (id) => document.getElementById(id);
  const supabase = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(KRAZE_SUPABASE_URL, KRAZE_SUPABASE_KEY)
    : null;

  let tabActiva = "email";

  // ===== Helpers =====
  function mostrarError(msg) {
    const el = $("kError");
    el.textContent = "⚠ " + msg;
    el.classList.add("visible");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function ocultarError() { $("kError").classList.remove("visible"); }
  function mostrarOverlay(txt) {
    $("kOverlayTxt").textContent = txt || "Cargando...";
    $("kOverlay").classList.add("visible");
  }
  function ocultarOverlay() { $("kOverlay").classList.remove("visible"); }
  function limpiarTel(s) { return String(s || "").replace(/\D/g, ""); }

  // ===== Guardar sesión en localStorage =====
  function guardarSesion(user, perfil) {
    try {
      if (!user || !user.id) return;
      localStorage.setItem("kraze_usuario_id", user.id);
      localStorage.setItem("kraze_user_id", user.id);
      if (perfil) localStorage.setItem("kraze_usuario", JSON.stringify(perfil));
      if (user.email) localStorage.setItem("kraze_email", user.email);
      if (user.phone) localStorage.setItem("kraze_telefono", user.phone);
    } catch (_) {}
  }

  // ===== Redirigir según rol =====
  function redirigirSegunRol(rol) {
    const r = (rol || "pasajero").toLowerCase();
    if (r === "transportista") location.href = "04-Home-Transportista.html";
    else if (r === "tienda") location.href = "19c-Panel-Admin-Tiendas.html";
    else if (r === "admin") location.href = "19c-Panel-Admin-Tiendas.html";
    else location.href = "04-Home-Pasajero.html";
  }

  // ===== Obtener rol desde profiles =====
  async function obtenerRol(userId) {
    try {
      const { data } = await supabase
        .from("profiles")
        .select("rol, role")
        .eq("id", userId)
        .maybeSingle();
      if (!data) return "pasajero";
      return data.rol || data.role || "pasajero";
    } catch (_) {
      return "pasajero";
    }
  }

  // ===== Crear perfil si no existe (para Google) =====
  async function asegurarPerfil(user) {
    const meta = user.user_metadata || {};
    const nombre = meta.full_name || meta.name || (user.email ? user.email.split("@")[0] : "Usuario Kraze");
    const email = user.email || null;
    const foto = meta.avatar_url || meta.picture || null;

    const { data: existente } = await supabase
      .from("profiles")
      .select("id, rol, role")
      .eq("id", user.id)
      .maybeSingle();

    if (existente) {
      return existente.rol || existente.role || "pasajero";
    }

    mostrarOverlay("Creando tu cuenta...");
    const nuevoPerfil = {
      id: user.id,
      nombre: nombre,
      email: email,
      telefono: user.phone || null,
      foto_url: foto,
      rol: "pasajero",
      role: "pasajero",
      pais: "Venezuela",
      activo: true,
      verificado: true,
      full_name: nombre
    };

    const { error: errIns } = await supabase.from("profiles").insert(nuevoPerfil);
    if (errIns && !/duplicate|unique/i.test(errIns.message)) {
      mostrarError("Error guardando tu cuenta: " + errIns.message);
      ocultarOverlay();
      return "pasajero";
    }
    return "pasajero";
  }

  // ===== PROCESAR CALLBACK DE OAUTH =====
  // Esta es la función crítica que faltaba. Detecta el hash/token que Supabase
  // devuelve después de Google y crea la sesión real.
  async function procesarCallbackOAuth() {
    if (!supabase) return false;

    const url = window.location.href;

    // Caso 1: hash con access_token (flujo implícito, típico de Supabase)
    if (url.includes("access_token=") || url.includes("refresh_token=")) {
      mostrarOverlay("Verificando sesión...");
      try {
        // Supabase detecta el hash automáticamente con getSession()
        const { data, error } = await supabase.auth.getSession();
        if (error || !data.session || !data.session.user) {
          // Intentar esperar un instante (Supabase procesa el hash async)
          await new Promise(r => setTimeout(r, 800));
          const { data: d2 } = await supabase.auth.getSession();
          if (!d2.session || !d2.session.user) {
            ocultarOverlay();
            mostrarError("No se pudo procesar la sesión de Google.");
            // Limpiar el hash
            window.history.replaceState({}, "", window.location.pathname);
            return false;
          }
          return await finalizarLogin(d2.session.user);
        }
        return await finalizarLogin(data.session.user);
      } catch (e) {
        ocultarOverlay();
        mostrarError("Error procesando sesión: " + e.message);
        return false;
      }
    }

    // Caso 2: parámetro ?code= (flujo PKCE)
    if (url.includes("?code=") || url.includes("&code=")) {
      mostrarOverlay("Verificando código...");
      try {
        const { data, error } = await supabase.auth.exchangeCodeForSession(url);
        if (error || !data.session || !data.session.user) {
          ocultarOverlay();
          mostrarError("No se pudo intercambiar el código.");
          return false;
        }
        return await finalizarLogin(data.session.user);
      } catch (e) {
        ocultarOverlay();
        mostrarError("Error intercambiando código: " + e.message);
        return false;
      }
    }

    // Caso 3: hash con error
    if (url.includes("error=")) {
      const params = new URLSearchParams(url.split("#")[1] || url.split("?")[1] || "");
      const err = params.get("error_description") || params.get("error") || "Error de autenticación";
      mostrarError(err);
      // Limpiar el hash
      window.history.replaceState({}, "", window.location.pathname);
      return false;
    }

    return false;
  }

  // ===== Finalizar login (guardar y redirigir) =====
  async function finalizarLogin(user) {
    try {
      const rol = await asegurarPerfil(user);
      guardarSesion(user, { rol: rol });
      localStorage.setItem("kraze_rol", rol);
      localStorage.removeItem("kraze_login_intent");

      // Limpiar el hash de la URL
      window.history.replaceState({}, "", window.location.pathname);

      mostrarOverlay("¡Bienvenido!");
      setTimeout(() => redirigirSegunRol(rol), 400);
      return true;
    } catch (e) {
      ocultarOverlay();
      mostrarError("Error finalizando login: " + e.message);
      return false;
    }
  }

  // ===== Login con Google =====
  async function loginGoogle() {
    ocultarError();
    if (!supabase) { mostrarError("Sin conexión. Recarga la página."); return; }

    try {
      localStorage.setItem("kraze_login_intent", "google");

      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: window.location.origin + "/02-Login.html",
          skipBrowserRedirect: false
        }
      });

      if (error) {
        mostrarError("Error con Google: " + error.message);
        return;
      }
      if (data && data.url) {
        window.location.href = data.url;
      }
    } catch (e) {
      mostrarError("Error con Google: " + e.message);
    }
  }

  // ===== Login con Email =====
  async function loginEmail() {
    ocultarError();
    const email = $("kEmail").value.trim().toLowerCase();
    const pass = $("kPassEmail").value;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { mostrarError("Correo inválido."); return; }
    if (pass.length < 6) { mostrarError("Contraseña: mínimo 6 caracteres."); return; }
    if (!supabase) { mostrarError("Sin conexión. Recarga la página."); return; }

    const btn = $("kBtnEmail");
    btn.disabled = true;
    const txt = btn.innerHTML;
    btn.innerHTML = '<span class="k-spin"></span> Entrando...';

    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email: email, password: pass });
      if (error) {
        mostrarError(error.message === "Invalid login credentials"
          ? "Correo o contraseña incorrectos."
          : error.message);
        btn.disabled = false;
        btn.innerHTML = txt;
        return;
      }
      if (!data.user) {
        mostrarError("No se pudo iniciar sesión.");
        btn.disabled = false;
        btn.innerHTML = txt;
        return;
      }
      await finalizarLogin(data.user);
    } catch (e) {
      mostrarError("Error: " + e.message);
      btn.disabled = false;
      btn.innerHTML = txt;
    }
  }

  // ===== Login con Teléfono =====
  async function loginTelefono() {
    ocultarError();
    let tel = $("kTel").value.trim();
    const pass = $("kPassTel").value;

    tel = tel.replace(/\s+/g, "");
    if (!tel.startsWith("+")) {
      const digits = limpiarTel(tel);
      if (digits.startsWith("0")) tel = "+58" + digits.substring(1);
      else if (digits.startsWith("58")) tel = "+" + digits;
      else tel = "+58" + digits;
    }

    if (limpiarTel(tel).length < 10) { mostrarError("Teléfono inválido."); return; }
    if (pass.length < 6) { mostrarError("Contraseña: mínimo 6 caracteres."); return; }
    if (!supabase) { mostrarError("Sin conexión. Recarga la página."); return; }

    const btn = $("kBtnTel");
    btn.disabled = true;
    const txt = btn.innerHTML;
    btn.innerHTML = '<span class="k-spin"></span> Entrando...';

    try {
      const { data, error } = await supabase.auth.signInWithPassword({ phone: tel, password: pass });
      if (error) {
        mostrarError(error.message === "Invalid login credentials"
          ? "Teléfono o contraseña incorrectos."
          : error.message);
        btn.disabled = false;
        btn.innerHTML = txt;
        return;
      }
      if (!data.user) {
        mostrarError("No se pudo iniciar sesión.");
        btn.disabled = false;
        btn.innerHTML = txt;
        return;
      }
      await finalizarLogin(data.user);
    } catch (e) {
      mostrarError("Error: " + e.message);
      btn.disabled = false;
      btn.innerHTML = txt;
    }
  }

  // ===== Tabs =====
  function cambiarTab(tab) {
    tabActiva = tab;
    document.querySelectorAll(".k-tab").forEach(t => {
      t.classList.toggle("activo", t.dataset.tab === tab);
    });
    $("kFormEmail").style.display = tab === "email" ? "block" : "none";
    $("kFormTel").style.display = tab === "telefono" ? "block" : "none";
    ocultarError();
  }

  // ===== Init =====
  async function init() {
    if (!supabase) {
      mostrarError("No se pudo conectar con el servidor.");
      return;
    }

    // PASO 1: Procesar callback de OAuth PRIMERO (antes de cualquier otra cosa)
    const procesado = await procesarCallbackOAuth();
    if (procesado) return; // Si procesó, ya redirige; no seguir

    // PASO 2: Verificar si ya hay sesión activa (usuario vuelve a la página)
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (session && session.user) {
        const rol = await obtenerRol(session.user.id);
        guardarSesion(session.user, { rol: rol });
        localStorage.setItem("kraze_rol", rol);
        redirigirSegunRol(rol);
        return;
      }
    } catch (_) {}

    // PASO 3: Si no hay sesión ni callback, mostrar login normal
    $("kBtnGoogle").addEventListener("click", loginGoogle);
    $("kBtnEmail").addEventListener("click", loginEmail);
    $("kBtnTel").addEventListener("click", loginTelefono);

    document.querySelectorAll(".k-tab").forEach(t => {
      t.addEventListener("click", () => cambiarTab(t.dataset.tab));
    });

    $("kPassEmail").addEventListener("keydown", e => { if (e.key === "Enter") loginEmail(); });
    $("kPassTel").addEventListener("keydown", e => { if (e.key === "Enter") loginTelefono(); });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
